name: Papyronix Django checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install system document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress tesseract-ocr tesseract-ocr-eng
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-deploy.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-deploy.txt
      - name: Check Django configuration
        env:
          DJANGO_SECRET_KEY: github-actions-test-only-secret
          DJANGO_DEBUG: 'True'
        run: python manage.py check
      - name: Verify migration state
        env:
          DJANGO_SECRET_KEY: github-actions-test-only-secret
          DJANGO_DEBUG: 'True'
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run automated tests
        env:
          DJANGO_SECRET_KEY: github-actions-test-only-secret
          DJANGO_DEBUG: 'True'
        run: python manage.py test --verbosity 2
